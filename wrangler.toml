name = "maxapi"
main = "workers/index.js"
compatibility_date = "2024-01-01"

# 自定义域名（Workers Custom Domain）：部署时自动在 gitcafe.ink zone 里
# 创建代理 DNS 记录并绑定到本 Worker。workers.dev 默认域名在国内被 DNS
# 污染，客户端统一走该域名。
routes = [
  { pattern = "max.gitcafe.ink", custom_domain = true },
]

[vars]
# API Key 由客户端通过 Authorization / x-api-key 传入，无需在此配置密钥
#
# 可选配置（写在 [vars] 或改用 `wrangler secret put <名字>`）：
#   PROXY_ACCESS_TOKEN     设置后所有请求必须带 x-proxy-token 头，避免域名被当作开放中继
#   UPSTREAM_TIMEOUT_MS    等上游响应头的超时，默认 300000（非流式请求要等生成完才有响应头）
#   STREAM_IDLE_TIMEOUT_MS 流式空闲超时，默认 120000；期间没有任何新数据即判定上游卡死
#   0 表示不限制

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = false

[placement]
# 固定执行位置（Placement Hint，与 smart 互斥）：指定 AWS 香港区域 ap-east-1，
# Cloudflare 会把 Worker 固定放在到该区域延迟最低的自建数据中心（香港）。
# 香港/华东（江苏）电信直连路由最优（约 35-45ms），且各上游（智谱/MiniMax/
# DeepSeek/火山/OpenAI）从香港出口访问均可达。
#
# 实测对比（2026-11-06，glm-5.3-flash 流式长文，各 5 轮）：
#   固定香港：3/5 健康
#   mode=smart：Worker 实际落在 AMS（阿姆斯特丹），1/5 健康
# Smart Placement 按上游加权 RTT 选点，海外上游（OpenAI）权重高时会把 Worker
# 挪到欧洲，对大陆上游（智谱/火山）是更长的跨境路径 —— 反而更易断流。
# 因此固定香港，不开 smart。
region = "aws:ap-east-1"
