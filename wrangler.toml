name = "mxapi"
main = "workers/index.js"
compatibility_date = "2024-01-01"

[vars]
# API Key 由客户端通过 Authorization / x-api-key 传入，无需在此配置密钥

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = false
head_sampling_rate = 1

[placement]
mode = "smart"
region = "aws:ap-east-1"
